name: Costruisci l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Capacitor e i font
        run: |
          npm install
          npm install --no-save @fontsource/im-fell-english-sc @fontsource/im-fell-english @fontsource/alegreya-sans

      - name: Font dentro la pagina
        run: node tools/fonts.js

      - name: Progetto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CarteDiTilde.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Carte di Tilde ${{ github.run_number }}
          body: Scarica CarteDiTilde.apk e aprilo sul telefono Android.
          files: CarteDiTilde.apk
